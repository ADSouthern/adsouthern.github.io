---
layout: default
title: Blog
permalink: /blog/
body_class: regal-site posts-page
full_width: true
---

<main class="alex-posts-page">
  <header class="alex-posts-header">
    <p class="alex-kicker">Collected Writings</p>
    <h1 class="alex-section-title">Latest Chronicles</h1>
  </header>

  <div class="posts alex-post-list">
    {% for post in site.posts %}
      <article class="post alex-post-listing">
        <h2>
          <a href="{{ post.url | relative_url }}">
            {{ post.title }}
          </a>
        </h2>

        <div class="alex-post-meta">
          {{ post.date | date: "%B %-d, %Y" }}
        </div>

        <div class="entry">
          {{ post.excerpt }}
        </div>

        <a
          href="{{ post.url | relative_url }}"
          class="alex-read-more"
        >
          Continue Reading &rarr;
        </a>
      </article>
    {% endfor %}
  </div>
</main>
