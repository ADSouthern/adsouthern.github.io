---
layout: default
---

<main class="alex-single-post">
  <article class="post alex-post-article">
    <header class="alex-post-header">
      <p class="alex-kicker">
        {{ page.date | date: "%B %-d, %Y" }}
      </p>

      <h1>{{ page.title }}</h1>
    </header>

    <div class="entry alex-post-content">
      {{ content }}
    </div>
    {% include disqus.html %}
  </article>
</main>
