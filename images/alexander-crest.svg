<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 512 512"
  role="img"
  aria-labelledby="crest-title"
>
  <title id="crest-title">Alexander AS shield crest</title>

  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4df9a"/>
      <stop offset="52%" stop-color="#d6ad52"/>
      <stop offset="100%" stop-color="#8b682b"/>
    </linearGradient>

    <linearGradient id="shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b5945"/>
      <stop offset="55%" stop-color="#0f3028"/>
      <stop offset="100%" stop-color="#071b18"/>
    </linearGradient>

    <radialGradient id="glow" cx="50%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#f4df9a" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f4df9a" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow
        dx="0"
        dy="14"
        stdDeviation="14"
        flood-color="#07111f"
        flood-opacity="0.5"
      />
    </filter>
  </defs>

  <!-- Outer gold shield -->
  <path
    d="
      M256 24
      L454 92
      L454 326
      Q454 380 405 414
      L256 496
      L107 414
      Q58 380 58 326
      L58 92
      Z
    "
    fill="url(#gold)"
    filter="url(#shadow)"
  />

  <!-- Inner green shield -->
  <path
    d="
      M256 48
      L430 108
      L430 317
      Q430 360 390 388
      L256 464
      L122 388
      Q82 360 82 317
      L82 108
      Z
    "
    fill="url(#shield)"
    stroke="#f4df9a"
    stroke-width="5"
  />

  <!-- Inner decorative line -->
  <path
    d="
      M256 70
      L408 122
      L408 307
      Q408 345 373 368
      L256 436
      L139 368
      Q104 345 104 307
      L104 122
      Z
    "
    fill="none"
    stroke="#d6ad52"
    stroke-width="3"
    stroke-opacity="0.55"
  />

  <!-- Soft center glow -->
  <path
    d="
      M256 48
      L430 108
      L430 317
      Q430 360 390 388
      L256 464
      L122 388
      Q82 360 82 317
      L82 108
      Z
    "
    fill="url(#glow)"
  />

  <!-- Upper diamond -->
  <rect
    x="245"
    y="115"
    width="22"
    height="22"
    rx="2"
    fill="#d6ad52"
    transform="rotate(45 256 126)"
  />

  <!-- Monogram -->
  <text
    x="248"
    y="306"
    fill="#f4df9a"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="168"
    font-weight="700"
    letter-spacing="-18"
    text-anchor="middle"
  >AS</text>

  <!-- Lower diamond -->
  <rect
    x="245"
    y="350"
    width="22"
    height="22"
    rx="2"
    fill="#d6ad52"
    transform="rotate(45 256 361)"
  />
</svg>
